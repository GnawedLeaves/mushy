<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mushy Six settings</title>
    <style>
      body {
        max-width: 420px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      p.hint {
        font-size: 12px;
        color: #666;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>mushy six extension settings</h1>
    <p class="hint">
      Generate a token in the Mushy Six web app under Settings &rarr; Browser extension, then paste it below.
    </p>

    <label for="apiBase">API base URL</label>
    <input id="apiBase" type="text" placeholder="http://localhost:3000" />

    <label for="token">Personal access token</label>
    <input id="token" type="password" placeholder="mushy_pat_..." />

    <button id="save">Save &amp; test connection</button>
    <p id="status"></p>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
